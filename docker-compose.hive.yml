# =============================================================================
# docker-compose.hive.yml
# Project: Big Data Classification and Prediction for Transportation and Logistics using Apache Hive
# =============================================================================
# Architecture:
# - Apache Hive 4.0.0 / 3.1.3 (Standalone Metastore & HiveServer2)
# - PostgreSQL Metastore Backend (Lightweight & ACID Compliant)
# - Configured for Apple Silicon (macOS ARM64 / M1, M2, M3, M4 compatibility)
# - Memory limit pinned to 3GB to operate smoothly within 16GB unified RAM
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Hive Metastore Database (PostgreSQL)
  # ---------------------------------------------------------------------------
  hive-metastore-db:
    image: postgres:15-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword
    volumes:
      - hive-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hive-net

  # ---------------------------------------------------------------------------
  # 2. Apache Hive Metastore Service
  # ---------------------------------------------------------------------------
  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    environment:
      HIVE_SERVER2_THRIFT_PORT: 9083
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Xmx1024m"
    ports:
      - "9083:9083"
    volumes:
      - ./bigdata/hive/warehouse:/opt/hive/data/warehouse
      - ./data/sample:/data/sample:ro
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - hive-net

  # ---------------------------------------------------------------------------
  # 3. Apache HiveServer2 (Thrift JDBC / ODBC / PyHive Endpoint)
  # ---------------------------------------------------------------------------
  hiveserver2:
    image: apache/hive:4.0.0
    container_name: hiveserver2
    depends_on:
      - hive-metastore
    environment:
      HIVE_SERVER2_THRIFT_PORT: 10000
      HIVE_SERVER2_WEBUI_PORT: 10002
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: "-Xmx1536m"
    ports:
      - "10000:10000"  # HiveServer2 Thrift port
      - "10002:10002"  # Hive Web UI
    volumes:
      - ./bigdata/hive/warehouse:/opt/hive/data/warehouse
      - ./bigdata/hive/queries:/opt/hive/queries:ro
      - ./bigdata/hive/scripts:/opt/hive/scripts:ro
      - ./data/sample:/data/sample:ro
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - hive-net

volumes:
  hive-db-data:
    name: bdt_hive_metastore_data

networks:
  hive-net:
    name: bdt_hive_network
    driver: bridge
